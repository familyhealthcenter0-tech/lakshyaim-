<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invoice - Lakshyaim Private Limited</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230d9b64'/%3E%3Ctext x='50' y='70' font-size='58' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='800'%3EL%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>(function(){try{var t=localStorage.getItem('lakshyaim_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="stylesheet" href="styles.css?v=20261139" />
  <style>
    /* Invoice-specific styles */
    .invoice-wrap {
      max-width: 800px;
      margin: 40px auto;
      background: #fff;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 40px;
      box-shadow: var(--shadow);
    }
    .invoice-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 2px solid var(--green);
    }
    .invoice-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .invoice-brand .logo-mark {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(150deg, var(--green), var(--green-dark));
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 1.4rem;
    }
    .invoice-brand h1 {
      font-size: 1.5rem;
      margin: 0;
      color: var(--ink);
    }
    .invoice-brand p {
      margin: 0;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .invoice-meta {
      text-align: right;
    }
    .invoice-meta h2 {
      font-size: 1.8rem;
      color: var(--green);
      margin: 0 0 4px;
    }
    .invoice-meta p {
      margin: 2px 0;
      font-size: 0.88rem;
      color: var(--muted);
    }
    .invoice-meta .invoice-no {
      font-weight: 700;
      color: var(--ink);
      font-size: 1rem;
    }
    .invoice-parties {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 32px;
    }
    .invoice-party h3 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin: 0 0 8px;
    }
    .invoice-party p {
      margin: 2px 0;
      font-size: 0.92rem;
    }
    .invoice-party .party-name {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--ink);
    }
    .invoice-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 24px;
    }
    .invoice-table th {
      background: var(--green-light);
      color: var(--green-dark);
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 12px 14px;
      text-align: left;
      border-bottom: 2px solid var(--green);
    }
    .invoice-table td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--card-border);
      font-size: 0.92rem;
    }
    .invoice-table tr:last-child td {
      border-bottom: none;
    }
    .invoice-table .text-right {
      text-align: right;
    }
    .invoice-table .text-center {
      text-align: center;
    }
    .invoice-totals {
      margin-left: auto;
      width: 320px;
      margin-bottom: 24px;
    }
    .invoice-totals .total-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 0.92rem;
    }
    .invoice-totals .total-row.grand {
      border-top: 2px solid var(--green);
      padding-top: 12px;
      margin-top: 8px;
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--green);
    }
    .invoice-footer {
      text-align: center;
      padding-top: 24px;
      border-top: 1px solid var(--card-border);
      color: var(--muted);
      font-size: 0.82rem;
    }
    .invoice-actions {
      max-width: 800px;
      margin: 20px auto;
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .invoice-actions .btn {
      padding: 10px 24px;
    }

    /* Print styles */
    @media print {
      body { background: #fff !important; font-size: 11px; }
      .navbar, .invoice-actions, .topbar { display: none !important; }
      .invoice-wrap { box-shadow: none; border: none; margin: 0; padding: 12px 16px; max-width: 100%; }
      .invoice-header { margin-bottom: 16px; padding-bottom: 12px; }
      .invoice-brand .logo-mark, .invoice-brand img { width: 36px; height: 36px; }
      .invoice-brand h1 { font-size: 1.2rem; }
      .invoice-brand p { font-size: 0.75rem; margin: 0; }
      .invoice-meta h2 { font-size: 1.4rem; }
      .invoice-meta p { font-size: 0.78rem; margin: 1px 0; }
      .invoice-parties { gap: 12px; margin-bottom: 16px; }
      .invoice-party h3 { font-size: 0.78rem; margin: 0 0 4px; }
      .invoice-party p { font-size: 0.82rem; margin: 1px 0; }
      .invoice-party .party-name { font-size: 0.92rem; }
      .invoice-table th { padding: 6px 8px; font-size: 0.75rem; }
      .invoice-table td { padding: 6px 8px; font-size: 0.82rem; }
      .invoice-totals { width: 280px; margin-bottom: 12px; }
      .invoice-totals .total-row { padding: 4px 0; font-size: 0.82rem; }
      .invoice-totals .total-row.grand { font-size: 1rem; padding-top: 8px; }
      .invoice-footer { padding-top: 12px; font-size: 0.75rem; }
      .invoice-footer p { margin: 2px 0; }
      .invoice-wrap > div[style*="margin-top:24px"] { margin-top: 12px !important; padding: 10px !important; }
      .invoice-wrap > div[style*="margin-top:24px"] ul { margin: 0; }
      .invoice-wrap > div[style*="margin-top:24px"] li { font-size: 0.75rem; line-height: 1.5; }
      .invoice-wrap > div[style*="display:flex"] { margin-bottom: 12px !important; }
      .invoice-wrap > div[style*="display:flex"] div { margin-top: 24px !important; }
      @page { margin: 8mm; size: A4; }
    }

    @media (max-width: 640px) {
      .invoice-parties { grid-template-columns: 1fr; }
      .invoice-header { flex-direction: column; gap: 16px; }
      .invoice-meta { text-align: left; }
      .invoice-totals { width: 100%; }
      .invoice-wrap { padding: 24px 16px; margin: 20px 16px; }
    }
  </style>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1e40af" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Lakshyaim" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='40' fill='%231e40af'/%3E%3Ctext x='96' y='128' font-size='100' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='800'%3EL%3C/text%3E%3C/svg%3E" />
</head>
<body>

  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo">
        <span class="logo-mark">L</span>
        <span class="logo-text">Lakshyaim</span>
      </a>
      <div class="nav-actions">
        <button class="icon-btn theme-toggle" id="themeToggle" aria-label="Switch to dark mode">Theme</button>
        <a href="admin.html" class="btn btn-sm btn-ghost">Admin</a>
      </div>
    </div>
  </header>

  <div class="invoice-actions">
    <button class="btn" onclick="window.print()">Print Invoice</button>
    <a href="admin.html" class="btn btn-outline">Back to Admin</a>
  </div>

  <div class="invoice-wrap" id="invoiceContent">
    <p style="text-align:center;color:var(--muted);padding:60px 0">Loading invoice...</p>
  </div>

  <script src="products.js?v=20261139"></script>
  <script src="site-content.js?v=20261139"></script>
  <script>
    (function() {
      const params = new URLSearchParams(location.search);
      const orderId = params.get("id");
      if (!orderId) {
        document.getElementById("invoiceContent").innerHTML = '<p style="text-align:center;color:var(--muted);padding:60px 0">Invoice ID missing.</p>';
        return;
      }

      let orders = [];
      try { orders = JSON.parse(localStorage.getItem("lakshyaim_orders") || "[]"); } catch {}
      const order = orders.find((o) => o.id === orderId);
      if (!order) {
        document.getElementById("invoiceContent").innerHTML = '<p style="text-align:center;color:var(--muted);padding:60px 0">Order not found.</p>';
        return;
      }

      let settings = {};
      try { settings = JSON.parse(localStorage.getItem("lakshyaim_settings") || "{}"); } catch {}
      const gstin = settings.gstin || "";
      const gstRate = settings.gstRate || 0;
      const companyName = settings.companyName || "Lakshyaim Private Limited";
      const companyPhone = settings.companyPhone || "";
      const companyEmail = settings.companyEmail || "";
      const companyAddress = settings.companyAddress || "";
      const companyLogo = settings.logo || "";
      const shipping = 0; // shipping already included in total
      const subtotal = order.total; // total includes everything
      const fmt = (n) => "\u20B9" + Number(n).toLocaleString("en-IN");

      const itemsHTML = order.items.map((item, i) => `
        <tr>
          <td class="text-center">${i + 1}</td>
          <td>${item.name}</td>
          <td class="text-center">${item.qty}</td>
          <td class="text-right">${fmt(item.price)}</td>
          <td class="text-right">${fmt(item.price * item.qty)}</td>
        </tr>
      `).join("");

      const html = `
        <div class="invoice-header">
          <div class="invoice-brand">
            ${companyLogo ? `<img src="${companyLogo}" alt="Logo" style="width:48px;height:48px;border-radius:12px;object-fit:contain" />` : `<span class="logo-mark">L</span>`}
            <div>
              <h1>${companyName}</h1>
              <p>Science-backed nutrition for everyday life</p>
              ${companyAddress ? `<p style="font-size:0.82rem;color:var(--muted)">${companyAddress}</p>` : ""}
              ${companyPhone ? `<p style="font-size:0.82rem;color:var(--muted)">Phone: ${companyPhone}</p>` : ""}
              ${companyEmail ? `<p style="font-size:0.82rem;color:var(--muted)">Email: ${companyEmail}</p>` : ""}
              ${gstin ? `<p style="font-size:0.82rem;color:var(--muted)">GSTIN: ${gstin}</p>` : ""}
            </div>
          </div>
          <div class="invoice-meta">
            <h2>INVOICE</h2>
            <p class="invoice-no"># ${order.id}</p>
            <p>Date: ${order.date}</p>
            <p>Status: ${order.status}</p>
            ${order.paymentId ? `<p>Payment ID: ${order.paymentId}</p>` : ""}
          </div>
        </div>

        <div class="invoice-parties">
          <div class="invoice-party">
            <h3>Bill To</h3>
            <p class="party-name">${order.customer.name}</p>
            <p>${order.customer.address || ""}</p>
            <p>${order.customer.city || ""}${order.customer.state ? ", " + order.customer.state : ""}${order.customer.pin ? " - " + order.customer.pin : ""}</p>
            <p>Phone: ${order.customer.phone || ""}</p>
            <p>Email: ${order.customer.email || ""}</p>
          </div>
          <div class="invoice-party">
            <h3>Ship To</h3>
            <p class="party-name">${order.customer.name}</p>
            <p>${order.customer.address || ""}</p>
            <p>${order.customer.city || ""}${order.customer.state ? ", " + order.customer.state : ""}${order.customer.pin ? " - " + order.customer.pin : ""}</p>
          </div>
        </div>



        <table class="invoice-table">
          <thead>
            <tr>
              <th class="text-center">#</th>
              <th>Item Description</th>
              <th class="text-center">Qty</th>
              <th class="text-right">Unit Price</th>
              <th class="text-right">Amount</th>
            </tr>
          </thead>
          <tbody>
            ${itemsHTML}
          </tbody>
        </table>

        <div class="invoice-totals">
          <div class="total-row">
            <span>Subtotal</span>
            <b>${fmt(order.total)}</b>
          </div>
          ${gstRate ? (() => {
            const gstAmount = Math.round((order.total * gstRate) / (100 + gstRate));
            return `
          <div class="total-row">
            <span>GST (${gstRate}%)</span>
            <b>${fmt(gstAmount)}</b>
          </div>`;
          })() : ""}
          <div class="total-row">
            <span>Shipping</span>
            <b>FREE</b>
          </div>
          <div class="total-row grand">
            <span>Total</span>
            <b>${fmt(order.total)}</b>
          </div>
        </div>

        <div style="margin-bottom:24px">
          <p style="font-size:0.88rem;color:var(--muted)"><b>Payment Method:</b> ${order.pay || "Razorpay"}</p>
          ${order.paymentId ? `<p style="font-size:0.88rem;color:var(--muted)"><b>Transaction ID:</b> ${order.paymentId}</p>` : ""}
        </div>

        <div style="margin-top:24px;padding:16px;background:var(--alt);border-radius:10px;margin-bottom:24px">
          <h3 style="font-size:0.9rem;margin:0 0 8px;color:var(--ink)">Terms & Conditions</h3>
          <ul style="margin:0;padding-left:18px;font-size:0.82rem;color:var(--muted);line-height:1.8">
            <li>Goods once sold will not be taken back or exchanged.</li>
            <li>Payment is due within 7 days of invoice date.</li>
            <li>All disputes subject to local jurisdiction.</li>
            <li>This is a computer-generated invoice and does not require a physical signature.</li>
          </ul>
        </div>

        <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px;padding-top:16px">
          <div>
            <p style="font-size:0.82rem;color:var(--muted);margin:0">Customer Signature</p>
            <div style="border-bottom:1px solid var(--card-border);width:180px;margin-top:40px"></div>
          </div>
          <div style="text-align:right">
            <p style="font-size:0.82rem;color:var(--muted);margin:0">Authorized Signatory</p>
            <div style="border-bottom:1px solid var(--card-border);width:180px;margin-top:40px;margin-left:auto"></div>
            <p style="font-size:0.78rem;color:var(--muted);margin:4px 0 0">${companyName}</p>
          </div>
        </div>

        <div class="invoice-footer">
          <p>Thank you for shopping with ${companyName}!</p>
          <p>For queries, contact us at ${companyEmail || "our support email"}. This is a computer-generated invoice.</p>
          ${gstin ? `<p style="margin-top:8px">GSTIN: ${gstin}</p>` : ""}
        </div>
      `;

      document.getElementById("invoiceContent").innerHTML = html;
    })();
  </script>
  <script src="theme.js?v=20261139"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
