<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details - Lakshyaim Private Limited</title>
  <meta name="description" content="Detailed product information including description, benefits, ingredients, and usage." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230d9b64'/%3E%3Ctext x='50' y='70' font-size='58' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='800'%3EL%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>(function(){try{var t=localStorage.getItem('lakshyaim_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="stylesheet" href="styles.css?v=20261118" />
</head>
<body>

  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo">
        <span class="logo-mark">L</span>
        <span class="logo-text">Lakshyaim</span>
      </a>
      <div class="nav-actions">
        <button class="icon-btn theme-toggle" id="themeToggle" aria-label="Switch to dark mode">Theme</button>
        <a href="index.html" class="btn btn-sm btn-ghost">Back to Home</a>
        <a href="cart.html" class="icon-btn" aria-label="Cart"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg><span class="cart-count">0</span></a>
      </div>
    </div>
  </header>

  <main class="container" style="padding:40px 0 80px">
    <div id="productDetail">
      <p style="text-align:center;color:var(--muted);padding:60px 0">Loading product...</p>
    </div>
  </main>

  <footer class="footer" id="contact">
    <div class="container footer-grid">
      <div>
        <a href="index.html" class="logo footer-logo"><span class="logo-mark">L</span><span class="logo-text">Lakshyaim</span></a>
        <p class="footer-sub">Lakshyaim Private Limited - balanced, science-backed nutrition for everyday life.</p>
      </div>
    </div>
    <div class="container footer-bottom">
      <p>&copy; 2026 Lakshyaim Private Limited - All rights reserved.</p>
    </div>
  </footer>

  <script src="products.js?v=20261118"></script>
  <script>
    (async function() {
      const params = new URLSearchParams(location.search);
      const idx = parseInt(params.get("id") || "0", 10);
      const products = await getProducts();
      const p = products[idx];
      if (!p) {
        document.getElementById("productDetail").innerHTML = '<p style="text-align:center;color:var(--muted);padding:60px 0">Product not found.</p>';
        return;
      }

      const stars = "\u2605".repeat(p.rating) + "\u2606".repeat(5 - p.rating);
      const mrp = p.mrp && p.mrp > p.price ? `<s style="color:var(--muted);font-size:1.1rem;margin-left:8px">${formatPrice(p.mrp)}</s>` : "";
      const discount = p.mrp && p.mrp > p.price ? Math.round(((p.mrp - p.price) / p.mrp) * 100) : 0;
      const benefits = (p.benefits || []).map(b => `<li style="padding:6px 0;border-bottom:1px solid var(--card-border)">${b}</li>`).join("");
      const imgAttrs = p.imgZoom ? `style="transform:scale(${p.imgZoom});transform-origin:${p.imgPos || "50% 50%"}"` : (p.imgPos ? `style="object-position:${p.imgPos}"` : "");

      document.title = p.name + " - Lakshyaim";
      document.getElementById("productDetail").innerHTML = `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start" class="product-detail-grid">
          <div class="product-detail-img" style="background:${p.bg};border-radius:20px;overflow:hidden;position:relative;min-height:400px;display:grid;place-items:center">
            <img src="${p.image}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover;${imgAttrs.replace('style="','').replace('"','')}" onerror="this.remove()" />
            ${discount ? `<span style="position:absolute;top:16px;left:16px;background:var(--gold);color:#fff;padding:4px 12px;border-radius:999px;font-size:0.8rem;font-weight:700">${discount}% OFF</span>` : ""}
          </div>
          <div class="product-detail-info">
            <p class="eyebrow" style="text-align:left;transform:none;left:0;display:inline-block">${p.tag}</p>
            <h1 style="font-size:clamp(1.6rem,3vw,2.2rem);margin:8px 0 12px">${p.name}</h1>
            <p class="stars" style="font-size:1.1rem;margin-bottom:12px">${stars} <span style="color:var(--muted);font-size:0.9rem">(${p.reviews} reviews)</span></p>
            <p style="font-size:2rem;font-weight:800;color:var(--green);margin-bottom:8px">${formatPrice(p.price)}${mrp}</p>
            ${p.weight ? `<p style="color:var(--muted);font-size:0.88rem;margin-bottom:16px">${p.weight} | ${p.servings} servings</p>` : ""}
            <p style="color:var(--muted);line-height:1.7;margin-bottom:20px">${p.description || ""}</p>
            
            ${benefits ? `
            <div style="margin-bottom:20px">
              <h3 style="font-size:1.05rem;margin-bottom:8px">Key Benefits</h3>
              <ul style="list-style:none;padding:0">${benefits}</ul>
            </div>` : ""}
            
            ${p.ingredients ? `
            <div style="margin-bottom:20px">
              <h3 style="font-size:1.05rem;margin-bottom:8px">Ingredients</h3>
              <p style="color:var(--muted);font-size:0.88rem;line-height:1.6">${p.ingredients}</p>
            </div>` : ""}
            
            ${p.usage ? `
            <div style="margin-bottom:24px">
              <h3 style="font-size:1.05rem;margin-bottom:8px">How to Use</h3>
              <p style="color:var(--muted);font-size:0.88rem;line-height:1.6">${p.usage}</p>
            </div>` : ""}
            
            <div style="display:flex;gap:12px;flex-wrap:wrap">
              <button class="btn btn-full add-cart-btn" data-index="${idx}" style="flex:1;min-width:200px">Add to Cart</button>
              <a href="cart.html" class="btn btn-outline" style="flex:1;min-width:120px;text-align:center">View Cart</a>
            </div>
          </div>
        </div>
      `;
    })();

    // Add to cart handler
    document.addEventListener("click", (e) => {
      if (e.target.classList.contains("add-cart-btn")) {
        const idx = Number(e.target.dataset.index);
        // Use the global addToCart if available, else redirect
        if (typeof addToCart === "function") {
          addToCart(idx);
        } else {
          // Fallback: add to cart via localStorage
          (async () => {
            const products = await getProducts();
            const p = products[idx];
            const cart = getCart();
            const existing = cart.find((c) => c.name === p.name);
            if (existing) existing.qty += 1;
            else cart.push({ name: p.name, price: p.price, qty: 1, image: p.image });
            saveCart(cart);
            location.href = "cart.html";
          })();
        }
      }
    });
  </script>
  <script src="theme.js?v=20261118"></script>
</body>
</html>
PY
